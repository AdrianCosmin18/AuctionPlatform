server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/auctions
spring.datasource.username=auctions
spring.datasource.password=auctions

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=auctions
spring.rabbitmq.password=auctions
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITETIMEOUT:5000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@archivebid.test}
app.mail.startup-test-recipient=${APP_MAIL_STARTUP_TEST_RECIPIENT:}
app.mail.startup-test-required=${APP_MAIL_STARTUP_TEST_REQUIRED:false}
app.mail.startup-test-subject-prefix=${APP_MAIL_STARTUP_TEST_SUBJECT_PREFIX:[ArchiveBid SMTP Test]}
