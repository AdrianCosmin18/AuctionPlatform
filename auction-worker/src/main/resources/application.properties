server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/auctions
spring.datasource.username=auctions
spring.datasource.password=auctions

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=auctions
spring.rabbitmq.password=auctions
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.enabled=true
app.mail.from=no-reply@archivebid.test
