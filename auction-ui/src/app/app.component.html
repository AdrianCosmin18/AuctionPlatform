<div class="app-shell">
  <p-toast key="global-notifications" position="top-right" styleClass="auction-global-toast" />
  <p-confirmdialog></p-confirmdialog>
  <header class="app-shell__header">
    <p-toolbar>
      <ng-template #start>
        <div class="brand-lockup">
          <span class="brand-mark">
            <i class="pi pi-hammer"></i>
          </span>
          <div>
            <div class="brand-title">{{ title }}</div>
            <div class="brand-subtitle">Rare books, manuscripts, and historic archives</div>
          </div>
        </div>
      </ng-template>

      <ng-template #end>
        <div class="header-actions">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>Live marketplace</span>
          </div>
          <a pButton routerLink="/auctions" icon="pi pi-home" label="Browse Auctions" severity="contrast"></a>
          <a pButton routerLink="/dashboard" icon="pi pi-chart-bar" label="Dashboard" severity="secondary" [text]="true"></a>
          <a pButton routerLink="/my-auctions" icon="pi pi-briefcase" label="My Area" severity="secondary" [text]="true"></a>
          <a pButton routerLink="/notifications" severity="secondary" [text]="true" styleClass="notifications-link">
            <span class="notifications-link__content">
              <i class="pi pi-bell"></i>
              <span>Notifications</span>
              @if (unreadCount$ | async; as unreadCount) {
                @if (unreadCount > 0) {
                  <span class="notifications-badge">{{ unreadCount }}</span>
                }
              }
            </span>
          </a>
          <a pButton routerLink="/auctions/new" icon="pi pi-plus" label="List an Item" severity="secondary" [outlined]="true"></a>
        </div>
      </ng-template>
    </p-toolbar>
  </header>

  <main class="app-shell__content container-fluid">
    <router-outlet />
  </main>
</div>
