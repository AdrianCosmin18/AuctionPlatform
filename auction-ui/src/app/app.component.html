<div class="app-shell">
  <header class="app-shell__header">
    <p-toolbar>
      <ng-template #start>
        <div class="brand-lockup">
          <span class="brand-mark">
            <i class="pi pi-hammer"></i>
          </span>
          <div>
            <div class="brand-title">{{ title }}</div>
            <div class="brand-subtitle">Rare books, manuscripts, and historic archives</div>
          </div>
        </div>
      </ng-template>

      <ng-template #end>
        <div class="header-actions">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>Live marketplace</span>
          </div>
          <a pButton routerLink="/auctions" icon="pi pi-home" label="Browse Auctions" severity="contrast"></a>
          <a pButton routerLink="/my-watchlist" icon="pi pi-heart" label="My Watchlist" severity="secondary" [text]="true"></a>
          <a pButton routerLink="/auctions/new" icon="pi pi-plus" label="List an Item" severity="secondary" [outlined]="true"></a>
        </div>
      </ng-template>
    </p-toolbar>
  </header>

  <main class="app-shell__content container-fluid">
    <router-outlet />
  </main>
</div>
